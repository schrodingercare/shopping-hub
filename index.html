<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Shopping Hub</title>

  <link rel="stylesheet" href="style.css">

  <!-- ================= GOOGLE ANALYTICS GA4 ================= -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8F70FXMBM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-S8F70FXMBM', {
      send_page_view: true
    });
  </script>
  <!-- ======================================================== -->

  <!-- ================= META PIXEL ================= -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = true;
      n.version = '2.0';
      n.queue = [];
      t = b.createElement(e);
      t.async = true;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1161236731509845');
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1161236731509845&ev=PageView&noscript=1" />
  </noscript>
  <!-- ======================================================== -->

</head>

<body>

  <main class="card">
    <header>
      <h1 class="title">Free Shopping Hub</h1>
    </header>

    <section class="info">
      <p class="owner">330K Subscribers</p>
    </section>

    <section class="info">
      <p class="highlight">🔥 Free Shopping Hub 🛍️</p>
      <p class="highlight">Welcome to Free Shopping Hub! 🎁</p>

      <p>
        Get free products every day.<br>
        No fees — Only collect coins and get genuine products FREE.<br>
        Join now and grab your free items before they run out!
      </p>

      <a
        href="https://t.me/freeshoppinghub"
        target="_blank"
        class="join-btn"
        id="joinButton">
        Join Channel
      </a>
    </section>
  </main>

  <!-- ================= CLICK TRACKING ================= -->
  <script>
    document.getElementById('joinButton').addEventListener('click', function () {

      // Facebook Pixel Event
      fbq('track', 'Lead');

      // Google Analytics Event
      gtag('event', 'join_channel_click', {
        event_category: 'engagement',
        event_label: 'Telegram Join Button',
        value: 1
      });

    });
  </script>
  <!-- ================================================= -->

</body>
</html>
